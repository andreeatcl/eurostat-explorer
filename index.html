<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proiect Multimedia</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-left">
        <a href="#" class="subtitle"><span>Proiect Multimedia</span></a>
      </div>
      <div class="header-middle">
        <img
          src="https://cdn-icons-png.flaticon.com/512/4628/4628667.png"
          width="28"
          height="28"
        />
        <h1 class="title">VIZUALIZARE DATE</h1>
        <img
          src="https://cdn-icons-png.flaticon.com/512/4628/4628667.png"
          width="28"
          height="28"
        />
      </div>
      <nav class="header-right">
        <div class="nav-icon">
          <a href="#bar-chart-container"
            ><i class="fa-solid fa-chart-line"></i
          ></a>
        </div>
        <div class="nav-icon">
          <a href="#bubble-chart-container"
            ><i class="fa-solid fa-photo-film"></i
          ></a>
        </div>
        <div class="nav-icon">
          <a href="#table-container"><i class="fa-solid fa-database"></i></a>
        </div>
      </nav>
    </header>
    <div class="container">
      <section class="chart-container" id="bar-chart-container">
        <div class="chart-header">
          <h2>BAR CHART</h2>
          <div class="bar-controls">
            <select name="bar-country-select" id="bar-country-select"></select>
            <select name="bar-ind-select" id="bar-ind-select"></select>
          </div>
        </div>
      </section>
      <section class="chart-container" id="bubble-chart-container">
        <div class="chart-header">
          <h2>BUBBLE CHART</h2>
          <button id="btn-play">PLAY</button>
        </div>
      </section>
      <section class="chart-container" id="table-container">
        <div class="chart-header">
          <h2>TABLE</h2>
          <select name="table-select" id="table-select"></select>
        </div>
        <table id="table" class="table">
          <thead>
            <tr>
              <th>TARA</th>
              <th>PIB</th>
              <th>SV</th>
              <th>POP</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </div>
    <div id="loading-toast" class="loading-toast">
      <span id="toast-text">Loading data...</span>
    </div>
    <script type="module" src="script.js"></script>
  </body>
</html>
